# Worked example: Halifax, Nova Scotia, with every local section turned on.
# Use it as a pattern for your own city: swap the feeds, coordinates and keywords.
# To try it as-is:  python morning_paper.py --config examples/halifax.toml --dry-run

[general]
timezone = "America/Halifax"
lookback_hours = 26
title_prefix = "Morning Paper"
units = "metric"
delivery = "html"
sections = ["heads_up", "weather", "traffic", "local", "cyber", "sky"]

[location]
name = "Halifax, NS"
lat = 44.6488
lon = -63.5752
elevation_m = 30

# ---------- Weather ----------
[weather]
# Environment Canada RSS (forecast text + warnings). Tried in order; the first that works wins.
ec_rss = [
  "https://weather.gc.ca/rss/weather/44.649_-63.602_e.xml",
  "https://weather.gc.ca/rss/city/ns-19_e.xml",
]

# ---------- Traffic & construction ----------
[traffic]
max_items = 8
# Words that mark a provincial advisory as relevant to Halifax
area_keywords = ["Halifax", "Dartmouth", "Bedford", "Sackville", "Cole Harbour", "Eastern Passage",
                 "Highway 102", "Highway 111", "Highway 118", "Highway 103", "Highway 107", "Burnside", "HRM"]

# Province-wide advisories, filtered down to the Halifax area
[[traffic.feeds]]
name = "Province of Nova Scotia"
heading = "Provincial advisories (Halifax area)"
url = "https://novascotia.ca/news/rss/traffic.asp"
filter_by_area = true
lookback_hours = 168
max_items = 5

# The city lists its RSS feeds on one page; these are found by the label text next to each link
[traffic.index_page]
name = "Halifax RSS feeds page"
url = "https://www.halifax.ca/home/stay-informed/rss-feeds"
labels = ["Road closures and construction", "Halifax Transit service disruptions"]
lookback_hours = 48

# Active street closures from the city's open-data (ArcGIS) layer.
# Other cities' layers use different field names: map them under [traffic.arcgis_closures.fields].
[traffic.arcgis_closures]
name = "Halifax open data"
layer = "https://services2.arcgis.com/11XBiaBYA9Ep0yNJ/arcgis/rest/services/Street_Closures/FeatureServer/0"
exclude_stages = ["Pending Approval"]
type_order = ["Construction", "Utility", "Development", "Special Event", "Other", "Block Party"]
# fields = { street = "STREET_NAME", type = "CLOSURE_TYPE", start = "START_DATE", end = "END_DATE" }

# ---------- Local news ----------
[[local_news]]
name = "CBC Nova Scotia"
url = "https://www.cbc.ca/webfeed/rss/rss-canada-novascotia"
max_items = 3

[[local_news]]
name = "Halifax Examiner"
url = "https://www.halifaxexaminer.ca/feed/"
max_items = 2

[[local_news]]
name = "Global News Halifax"
url = "https://globalnews.ca/halifax/feed/"
max_items = 3

[[local_news]]
name = "Haligonia"
url = "https://haligonia.ca/feed/"
max_items = 3

# ---------- Cybersecurity ----------
[[cyber_news]]
name = "BleepingComputer"
url = "https://www.bleepingcomputer.com/feed/"
max_items = 5

[[cyber_news]]
name = "The Hacker News"
url = "https://feeds.feedburner.com/TheHackersNews"
max_items = 5

[[cyber_news]]
name = "Canadian Centre for Cyber Security"
url = "https://www.cyber.gc.ca/api/cccs/rss/v1/get?feed=alerts_advisories&lang=en"
max_items = 4

[[mainstream]]
name = "BBC Technology"
url = "https://feeds.bbci.co.uk/news/technology/rss.xml"

[[mainstream]]
name = "BBC World"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"

[[mainstream]]
name = "CBC Top Stories"
url = "https://www.cbc.ca/webfeed/rss/rss-topstories"

[heads_up]
cisa_kev = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
watchlist = ["Okta", "Entra", "Active Directory", "OpenSSH"]
big_vendors = ["Microsoft", "Windows", "Fortinet", "Palo Alto", "Ivanti", "Citrix", "VMware",
               "Cisco", "Linux kernel", "Google Chrome", "Apple", "AWS", "Cloudflare", "CrowdStrike"]
alarm_phrases = ["zero-day", "0-day", "actively exploited", "exploited in the wild", "emergency directive",
                 "global outage", "worldwide outage", "widespread outage", "mass exploitation",
                 "supply chain attack", "supply-chain attack", "cvss 10", "critical vulnerability",
                 "patch now", "wormable", "ransomware attack", "data breach", "outage", "hacked",
                 "cyberattack", "cyber attack"]
mainstream_cyber_words = ["hack", "cyber", "ransomware", "breach", "outage", "malware", "vulnerab",
                          "data leak", "it failure", "systems down", "crowdstrike", "microsoft"]
score_threshold = 3

# ---------- Sky News ----------
[sky]
aurora_kp_watch = 5
aurora_kp_good = 6
min_planet_alt_deg = 10
